d":120,"name":"La Galite Islands","region":"bizerte-north","governorate":"Bizerte","type":"remote-island","description":"Tunisia's most remote destination: a volcanic archipelago ~60 km offshore, crystal water, a handful of inhabitants.","tip":"Reachable only by special boat trips.","image":{"full":"https://upload.wikimedia.org/wikipedia/commons/5/52/La_Galite_island_%28MCPA_of_La_Galite_Archipelago%29.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/La_Galite_island_%28MCPA_of_La_Galite_Archipelago%29.jpg/960px-La_Galite_island_%28MCPA_of_La_Galite_Archipelago%29.jpg","sourcePage":"https://commons.wikimedia.org/wiki/File:La_Galite_island_(MCPA_of_La_Galite_Archipelago).jpg","articleUrl":"","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","author":"Anis Zarrouk","method":"commons-search-refined","query":"Galite archipelago","matched":"File:La Galite island (MCPA of La Galite Archipelago).jpg","localPath":"photos/120-la-galite-islands.jpg"}}],"itineraries":[{"id":"classic-7","title":"The Classic Loop","days":7,"theme":"First-timer highlights: history, a city and one desert night","transport":"Rental car (4x4 only if adding Ksar Ghilane)","stops":[{"day":1,"title":"Tunis & Carthage","detail":"Bardo Museum, Carthage (Antonine Baths, Byrsa), sunset in Sidi Bou Said."},{"day":2,"title":"Dougga & Kairouan","detail":"Roman Dougga in the morning, then holy Kairouan (Great Mosque, Aghlabid Basins). Overnight Kairouan."},{"day":3,"title":"El Jem & Sousse","detail":"El Jem amphitheatre en route to the Sousse medina/ribat. Overnight Sousse or Sfax."},{"day":4,"title":"Toward the desert","detail":"Long drive via Gabes to Tozeur. Sunset at the Belvedere."},{"day":5,"title":"Mountain oases + Star Wars","detail":"Chebika, Tamerza, Mides; afternoon Ong Jemel & Mos Espa. Overnight Tozeur."},{"day":6,"title":"Chott + Matmata","detail":"Cross Chott El Djerid; troglodyte Matmata. Overnight Matmata or Douz (camel sunset)."},{"day":7,"title":"Return north","detail":"Drive back to Tunis/Hammamet, or fly Tozeur/Djerba to Tunis to save a long day."}]},{"id":"grand-10","title":"The Grand Tour","days":10,"theme":"North loop adding the Roman northwest and the deep south","transport":"Rental car; 4x4 helpful for desert tracks","stops":[{"day":1,"title":"Tunis to Testour","detail":"Tunis to Bizerte to Cap Angela to Testour."},{"day":2,"title":"Roman northwest","detail":"Testour to Dougga to Bulla Regia to Le Kef."},{"day":3,"title":"Le Kef to Tozeur","detail":"Via Sbeitla (Sufetula) to Tozeur."},{"day":4,"title":"Oases & Star Wars","detail":"Mides, Chebika, Tamerza, then Mos Espa & Lars Homestead."},{"day":5,"title":"Chott to Toujane","detail":"Cross Chott El Djerid to Matmata (Sidi Driss) to Toujane."},{"day":6,"title":"Ksour run","detail":"Toujane, Ksar Hallouf, Ksar Hadada, Ghomrassen to Tataouine."},{"day":7,"title":"Berber villages","detail":"Ksar Ouled Soltane, Douiret, Chenini, back to Tataouine."},{"day":8,"title":"North to Mahdia","detail":"Tataouine to El Jem to Mahdia."},{"day":9,"title":"Mahdia to Sousse","detail":"Via Kairouan to Sousse."},{"day":10,"title":"Back to Tunis","detail":"Sousse to Hammamet to Tunis."}]},{"id":"complete-14","title":"The Complete Tunisia","days":14,"theme":"Grand Tour plus Cap Bon, north coast and Kroumirie","transport":"Rental car","stops":[{"day":"1-10","title":"Grand Tour","detail":"Run the 10-day Grand Tour above."},{"day":"11-12","title":"Cap Bon","detail":"Korbous hot springs, Kerkouane, Kelibia fort & Mansourah beach, El Haouaria caves, Nabeul pottery."},{"day":13,"title":"North coast & Kroumirie","detail":"Tabarka (Genoese fort, Les Aiguilles) and forested Ain Draham."},{"day":14,"title":"Bizerte & Ichkeul","detail":"Lake Ichkeul birdlife, Bizerte old port, back to Tunis."}]},{"id":"starwars-trail","title":"Star Wars / Tatooine Trail","days":5,"theme":"Film locations from the original and prequel trilogies","transport":"4x4 with local guide recommended for off-road sets","stops":[{"day":1,"title":"Ong Jemel & Mos Espa","detail":"Base in Tozeur; visit the Mos Espa set and camel-neck rock."},{"day":2,"title":"Sidi Bouhlel & Lars Homestead","detail":"Star Wars Canyon and the Lars Homestead dome at Chott El Gharsa."},{"day":3,"title":"Matmata / Sidi Driss","detail":"The underground Lars interior."},{"day":4,"title":"Ksour","detail":"Ksar Hadada & Ksar Ouled Soltane (slave quarters)."},{"day":5,"title":"Ajim, Djerba","detail":"Mos Eisley and Obi-Wan's home exterior."}]},{"id":"roman-trail","title":"Roman Ruins Trail","days":6,"theme":"The greatest Roman cities of Africa Proconsularis","transport":"Rental car","stops":[{"day":1,"title":"Bardo & Carthage","detail":"Mosaics first, then ancient Carthage."},{"day":2,"title":"Oudhna & Thuburbo Majus","detail":"Two quiet sites south of Tunis."},{"day":3,"title":"Dougga","detail":"The best-preserved Roman town in North Africa."},{"day":4,"title":"Bulla Regia & Chemtou","detail":"Underground villas and the marble quarries."},{"day":5,"title":"Makthar & Sbeitla","detail":"High-plateau ruins and the triple capitol of Sufetula."},{"day":6,"title":"El Jem","detail":"The colossal amphitheatre and mosaic museum."}]},{"id":"berber-south","title":"Berber South & Ksour","days":5,"theme":"Troglodyte and cliff villages and fortified granaries","transport":"Car; 4x4 for Ksar Ghilane","stops":[{"day":1,"title":"Matmata & Tamezret","detail":"Troglodyte homes and Berber hilltop village."},{"day":2,"title":"Toujane to Tataouine","detail":"Mountain village and weavers; set up in Tataouine."},{"day":3,"title":"Chenini, Douiret, Guermessa","detail":"The Berber cliff villages."},{"day":4,"title":"Granaries","detail":"Ksar Ouled Soltane and Ksar Hadada."},{"day":5,"title":"Ksar Ghilane","detail":"Desert-oasis night and hot spring."}]},{"id":"north-nature","title":"Slow North-Coast & Nature","days":5,"theme":"Ports, wetlands and cork-oak forests; best in spring or autumn","transport":"Rental car","stops":[{"day":1,"title":"Bizerte","detail":"Old port and kasbah."},{"day":2,"title":"Ichkeul & Cap Angela","detail":"Bird-rich lake and Africa's northern tip."},{"day":3,"title":"Ghar El Melh","detail":"Lagoon, forts and ramli gardens."},{"day":4,"title":"Tabarka","detail":"Coral coast, Genoese fort, Les Aiguilles."},{"day":5,"title":"Ain Draham & El Feija","detail":"Cork-oak forests and Barbary deer."}]}],"tips":{"bestTimeToVisit":{"sweetSpots":["April-June","September-October"],"notes":["Shoulder seasons offer mild 20-25C days, good for ruins and beaches.","Summer (Jun-Aug) is hot and busy on the coast; the Sahara can exceed 40C with dust storms - avoid desert travel then.","Winter is mild and green in the north; cool desert days and cold nights - pack layers.","Ramadan (starts mid-Feb 2026): many daytime cafes close and pace slows; be discreet eating/drinking in public during fasting hours."]},"money":["Currency is the Tunisian dinar (TND), a closed currency: can't be bought abroad or legally taken out. Exchange on arrival, convert leftovers before flying home, keep receipts.","Cash is king - many small shops, cafes, louages, rural guesthouses and desert camps are cash-only.","ATMs are common in cities/tourist areas but scarce in the deep south - withdraw before the Sahara.","Cards work in mid/upmarket hotels, supermarkets and some tourist-zone restaurants; don't rely on them elsewhere."],"gettingAround":["A rental car gives maximum freedom; a 4x4 is only really needed for Ksar Ghilane and dunes past Douz.","No Uber - use Bolt or Heetch apps in cities, or metered yellow taxis (insist on the meter or agree a price).","Louages (shared inter-city taxis) are cheap and frequent; trains link Tunis-Sousse-Sfax and the TGM links Tunis-Carthage-La Marsa.","Drive defensively: assertive driving, livestock on rural roads; avoid unfamiliar mountain/desert roads after dark."],"safety":["Generally safe; main risk is opportunistic petty theft in crowded souks and transport hubs. Wear bags cross-body, carry little cash, use the hotel safe.","Check your government's current advisory. Standing advice urges extra caution near the Libya and Algeria borders, the western mountains and military zones.","For desert trips use an established operator, share your route, and carry plenty of water."],"cultureEtiquette":["Dress modestly away from beach resorts - cover shoulders and knees for medinas, mosques and rural villages.","Handshakes are the norm; let local women initiate contact; hugs from acquaintances are not expected.","Bargaining is expected in souks (not fixed-price shops/restaurants) - stay friendly; 'La, shukran' deflects persistent sellers.","Ask before photographing people, especially women and inside religious sites."],"tipping":["Low-key but customary: round up or leave ~10% in restaurants (2-5 TND in cafes).","A few dinars for hotel porters/housekeeping; tip drivers and guides for good service."],"language":["Official languages are Arabic and French; Tunisian Arabic (Derja) is the street language.","French is widely understood and English is common in tourist areas.","Useful Derja: aslema (hello), shukran (thanks), barsha (a lot)."],"connectivity":["Buy a local SIM/eSIM on arrival - Ooredoo and Orange have the best coverage, Tunisie Telecom too.","SIMs run roughly 5-20 TND plus a data bundle; bring your passport to register.","Coverage is solid in towns and on main roads, patchy deep in the desert."],"healthPractical":["Stick to bottled/filtered water, especially in the south.","Desert: high-SPF sunscreen, hat, sunglasses, lots of water, sturdy shoes; nights get cold - bring a fleece even in shoulder season.","Carry toilet paper/hand gel for rural stops and small change for parking and hammam attendants.","Standard travel vaccinations; bring prescription meds with you."],"foodToTry":["Brik (egg-and-tuna fried pastry)","Couscous","Lablabi (chickpea soup)","Ojja (spicy egg & merguez)","Grilled fish on the coast","Octopus in Kerkennah","Deglet Nour dates from the Jerid","Makroudh pastries from Kairouan","Mint tea with pine nuts","Cap Bon muscat wine","Harissa (hot - comes with everything)"],"scamsToAvoid":["Agree taxi fares or insist on the meter before setting off.","Beware 'the site is closed, come to my shop instead' detours near medinas and ruins.","'Free' gifts, henna or guide offers usually aren't - clarify cost up front.","Only change money at banks, official bureaux or hotels, never on the street."]},"sources":[{"title":"Lonely Planet - Tunisia","url":"https://www.lonelyplanet.com/destinations/tunisia"},{"title":"Atlas Obscura - Tunisia","url":"https://www.atlasobscura.com/things-to-do/tunisia"},{"title":"WildyNess - Unknown places & Roman sites","url":"https://wildyness.com/news/unknown-place-attraction-tunisia"},{"title":"Where to Go in Tunisia - 7 hidden gems loved by locals","url":"https://www.wheretogointunisia.com/blog/7-hidden-gems-loved-by-locals"},{"title":"HomeExchange - 12 underrated places","url":"https://www.homeexchange.com/blog/news-tunisia-is-the-most-underrated-country-in-north-africa-here-are-12-places-that-prove-it/"},{"title":"Carthage Magazine","url":"https://carthagemagazine.com/"},{"title":"Unusual Nomad - Southern Tunisia itinerary","url":"https://unusualnomad.com/complete-southern-tunisia-desert-itinerary-oases-fortresses-berber-villages/"},{"title":"Nicki Posts Travel Stuff - 10-day road trip","url":"https://nickipoststravelstuff.com/tunisia-road-trip/"},{"title":"Against the Compass - Tunisia tips & itinerary","url":"https://againstthecompass.com/en/tunisia-travel-tips-itinerary/"},{"title":"The Mindful Traveller - South Tunisia road trip","url":"https://www.exploremindfully.com/southern-tunisia-road-trip/"},{"title":"Atlas & Boots - Star Wars locations","url":"https://www.atlasandboots.com/travel-blog/star-wars-film-locations-tunisia/"},{"title":"Connolly Cove - Djerba hidden gems","url":"https://www.connollycove.com/djerba-tunisia/"},{"title":"ASocialNomad - Sousse & Monastir","url":"https://asocialnomad.com/tunisia/what-to-see-in-sousse-guide/"},{"title":"Tunisi.info - Most beautiful medinas","url":"https://www.tunisi.info/en/tourism/medinas/the-10-most-beautiful-medinas-in-tunisia-gems-and-authentic-souks/"},{"title":"Tunisia Guru - Travel tips","url":"https://tunisiaguru.com/travel-tunisia/travel-tips-for-tunisia/"},{"title":"World Nomads - Crime & safety","url":"https://www.worldnomads.com/travel-safety/north-africa/tunisia/tunisia-crime-and-scams"},{"title":"Lonely Planet - Best time to visit","url":"https://www.lonelyplanet.com/articles/best-time-to-visit-tunisia"}]};
const regions={};DATA.regions.forEach(r=>regions[r.id]=r.name);
const sel=document.getElementById('region');DATA.regions.forEach(r=>{const o=document.createElement('option');o.value=r.id;o.textContent=r.name;sel.appendChild(o);});
const grid=document.getElementById('grid'),q=document.getElementById('q'),cnt=document.getElementById('count');
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(){
  const term=q.value.trim().toLowerCase(),reg=sel.value;grid.innerHTML='';let n=0;
  DATA.gems.forEach(g=>{
    if(reg&&g.region!==reg)return;
    if(term&&!((g.name+' '+g.type+' '+g.description).toLowerCase().includes(term)))return;
    n++;const im=g.image||{};
    const card=document.createElement('div');card.className='card';
    const attr=im.full?`<div class="attr">📷 ${esc(im.author||'Wikimedia Commons')}${im.license?' · '+esc(im.license):''} · <a href="${esc(im.sourcePage||im.articleUrl||'#')}" target="_blank" rel="noopener">source</a></div>`:'';
    const src=im.localPath||im.thumb;
    const photo=src?`<a href="${esc(im.sourcePage||im.articleUrl||'#')}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(src)}" alt="${esc(g.name)}"></a>`:'<div style="display:grid;place-items:center;height:100%;color:#6b7280">no photo</div>';
    card.innerHTML=`<div class="ph"><span class="id">#${g.id}</span>${photo}</div>
      <div class="body"><div class="nm">${esc(g.name)}</div>
      <div class="meta">${esc(regions[g.region]||g.region)} · ${esc(g.type)}</div>
      <div class="desc">${esc(g.description)}</div>
      ${g.tip?`<div class="tip">💡 ${esc(g.tip)}</div>`:''}${attr}</div>`;
    grid.appendChild(card);
  });
  cnt.textContent=n+' / '+DATA.gems.length+' places';
}
q.addEventListener('input',render);sel.addEventListener('change',render);render();
</script></body></html>
