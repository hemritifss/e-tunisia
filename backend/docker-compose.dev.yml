# Development override — runs the API in watch mode with the host source
# volume-mounted into the container.
#
# Usage (from the backend/ directory):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   docker compose logs -f api          # watch the Nest compilation logs
#
# Edit any .ts file under backend/src — Nest will hot-reload inside the
# container within ~1 second. No image rebuild, no container restart.
#
# To go back to the production image:
#   docker compose -f docker-compose.yml up -d --build api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Live source mount + a named volume for node_modules so the container's
    # Linux-built native bindings (bcrypt, sharp, resvg, etc.) aren't
    # shadowed by Windows/macOS host modules. dist/ also gets its own
    # volume to keep host build output out of the loop.
    volumes:
      - ./src:/app/src
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./uploads:/app/uploads
      - api_node_modules:/app/node_modules
      - api_dist:/app/dist

volumes:
  api_node_modules:
  api_dist:
